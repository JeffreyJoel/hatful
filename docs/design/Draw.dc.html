<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unwrap your match</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
.press{transition:transform 160ms ease-out}
.press:active{transform:scale(.97)}
:focus-visible{outline:3px solid #F4B83A;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important;transition-delay:0ms !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E3A2D; color: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div aria-hidden="true" style="height: 12px; flex-shrink: 0; background: repeating-linear-gradient(135deg, #D62F3A 0 14px, #FFFFFF 14px 28px)"></div>
<div style="flex-grow: 1; padding: 22px 24px 28px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #F4B83A">Sunday Dinner Club</p>
<div style="min-height: 132px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{wrapped}}" hint-placeholder-val="{{true}}">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 38px; line-height: 1.02; letter-spacing: -0.02em">Your match is in here, Tunde.</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #C4DACF">Check nobody is looking over your shoulder first.</p>
</sc-if>
<sc-if value="{{revealed}}" hint-placeholder-val="{{false}}">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 38px; line-height: 1.02; letter-spacing: -0.02em">You're gifting Priya.</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #C4DACF">Only you can see this. Keep it quiet until Sat 19 Dec.</p>
</sc-if>
</div>
<div style="position: relative; height: 400px; flex-shrink: 0">
<div aria-hidden="true">
<sc-for list="{{confetti}}" as="c" hint-placeholder-count="0">
<span style="{{c.style}}"></span>
</sc-for>
</div>
<div style="{{tagStyle}}">
<span aria-hidden="true" style="position: absolute; left: 16px; top: 16px; width: 18px; height: 18px; border-radius: 50%; background: #0E3A2D"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C22630">To</span>
<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.02em; color: #10231C">Priya</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 50%; margin-left: -110px; bottom: 0; width: 220px; height: 170px; border-radius: 6px 6px 18px 18px; background: #D62F3A; z-index: 2; overflow: hidden">
<span style="position: absolute; left: 50%; margin-left: -19px; top: 0; bottom: 0; width: 38px; background: #F4B83A"></span>
<span style="position: absolute; left: 0; right: 0; top: 0; height: 14px; background: #A81F29"></span>
</div>
<div aria-hidden="true" style="{{lidStyle}}">
<span style="position: absolute; left: 50%; margin-left: -19px; top: 0; bottom: 0; width: 38px; background: #F4B83A"></span>
<span style="position: absolute; left: 50%; margin-left: -44px; top: -30px; width: 40px; height: 40px; border-radius: 50% 50% 6px 50%; background: #F4B83A; transform: rotate(-8deg)"></span>
<span style="position: absolute; left: 50%; margin-left: 4px; top: -30px; width: 40px; height: 40px; border-radius: 50% 50% 50% 6px; background: #F4B83A; transform: rotate(8deg)"></span>
<span style="position: absolute; left: 50%; margin-left: -10px; top: -12px; width: 20px; height: 20px; border-radius: 6px; background: #D9A02B"></span>
</div>
</div>
<div style="flex-grow: 1"></div>
<sc-if value="{{wrapped}}" hint-placeholder-val="{{true}}">
<button type="button" class="press" onPointerDown="{{start}}" onPointerUp="{{cancel}}" onPointerLeave="{{cancel}}" onPointerCancel="{{cancel}}" onKeyDown="{{keyDown}}" onKeyUp="{{cancel}}" style="position: relative; height: 64px; border-radius: 20px; border: 1.5px solid #3C7361; background: #0A2B21; color: #FFFFFF; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 19px; cursor: pointer; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none">
<span>Hold to unwrap</span>
<span aria-hidden="true" style="{{fillStyle}}">Keep holding</span>
</button>
<p style="margin: 0; font-size: 13px; color: #C4DACF; text-align: center">Let go any time to keep it wrapped.</p>
</sc-if>
<sc-if value="{{revealed}}" hint-placeholder-val="{{false}}">
<a class="press" href="Match.dc.html" style="height: 64px; border-radius: 20px; background: #D62F3A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 19px">See Priya's wishlist</a>
<button type="button" class="press" onClick="{{rewrap}}" style="height: 44px; border: 0; background: transparent; color: #C4DACF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Wrap it back up</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"holdMs":{"editor":"range","default":1100,"min":400,"max":2500,"step":100,"unit":"ms"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { phase: 'wrapped' };
this.start = () => {
if (this.state.phase !== 'wrapped') return;
this.setState({ phase: 'holding' });
clearTimeout(this.timer);
this.timer = setTimeout(() => this.setState({ phase: 'revealed' }), this.props.holdMs ?? 1100);
};
this.cancel = () => {
if (this.state.phase !== 'holding') return;
clearTimeout(this.timer);
this.setState({ phase: 'wrapped' });
};
this.keyDown = (e) => {
if (e.repeat) return;
if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this.start(); }
};
this.rewrap = () => this.setState({ phase: 'wrapped' });
}
componentWillUnmount() { clearTimeout(this.timer); }
renderVals() {
const phase = this.state.phase;
const holding = phase === 'holding';
const open = phase === 'revealed';
const holdMs = this.props.holdMs ?? 1100;
const fillStyle = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#F4B83A;color:#10231C;pointer-events:none;'
+ 'clip-path:inset(0 ' + (holding || open ? '0' : '100%') + ' 0 0);'
+ 'transition:clip-path ' + (holding ? holdMs + 'ms linear' : '200ms ease-out');
const lidStyle = 'position:absolute;left:50%;margin-left:-124px;bottom:160px;width:248px;height:54px;border-radius:12px;background:#C22630;z-index:3;'
+ 'transform:' + (open ? 'translate(70px,-150px) rotate(24deg)' : holding ? 'translateY(-6px) rotate(-2deg)' : 'none') + ';'
+ 'opacity:' + (open ? '0' : '1') + ';'
+ 'transition:transform ' + (open ? '500ms cubic-bezier(.22,1,.36,1)' : holding ? holdMs + 'ms ease-in' : '200ms ease-out') + ',opacity ' + (open ? '400ms ease-out 100ms' : '150ms ease-out');
const tagStyle = 'position:absolute;left:50%;margin-left:-115px;top:30px;width:230px;height:130px;box-sizing:border-box;border-radius:20px;background:#FFFFFF;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;'
+ 'transform:' + (open ? 'translateY(0) rotate(-4deg) scale(1)' : 'translateY(210px) rotate(0deg) scale(.85)') + ';'
+ 'opacity:' + (open ? '1' : '0') + ';'
+ 'transition:transform ' + (open ? '600ms cubic-bezier(.34,1.56,.64,1) 120ms' : '200ms ease-out') + ',opacity ' + (open ? '200ms ease-out 120ms' : '120ms ease-out');
const bits = [[-150, -150, 40, '#F4B83A'], [-110, -40, -30, '#FFFFFF'], [-165, 40, 80, '#D62F3A'], [150, -160, -50, '#FFFFFF'], [120, -50, 25, '#F4B83A'], [165, 30, -70, '#D62F3A'], [-60, -205, 15, '#D62F3A'], [70, -210, -20, '#F4B83A'], [-140, 120, 60, '#FFFFFF'], [145, 125, -35, '#F4B83A']];
const confetti = bits.map((b, i) => ({
style: 'position:absolute;left:50%;top:230px;margin-left:-5px;width:10px;height:16px;border-radius:3px;z-index:1;background:' + b[3] + ';'
+ 'opacity:' + (open ? '1' : '0') + ';'
+ 'transform:' + (open ? 'translate(' + b[0] + 'px,' + b[1] + 'px) rotate(' + b[2] + 'deg)' : 'translate(0,0) rotate(0deg) scale(.5)') + ';'
+ 'transition:transform ' + (open ? '800ms cubic-bezier(.16,1,.3,1) ' + (100 + i * 20) + 'ms' : '150ms ease-out') + ',opacity ' + (open ? '200ms ease-out ' + (100 + i * 20) + 'ms' : '100ms ease-out')
}));
return {
wrapped: !open, revealed: open,
fillStyle: fillStyle, lidStyle: lidStyle, tagStyle: tagStyle, confetti: confetti,
start: this.start, cancel: this.cancel, keyDown: this.keyDown, rewrap: this.rewrap
};
}
}
</script>
</body>
</html>
