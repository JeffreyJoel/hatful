<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
.press{transition:transform 160ms ease-out}
.press:active{transform:scale(.97)}
:focus-visible{outline:3px solid #D62F3A;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7F5; color: #10231C; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div aria-hidden="true" style="height: 12px; flex-shrink: 0; background: repeating-linear-gradient(135deg, #D62F3A 0 14px, #FFFFFF 14px 28px)"></div>
<div style="flex-grow: 1; padding: 22px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em">Sunday Dinner Club</h1>
<p style="margin: 0; font-size: 14px; color: #40564D">Secret Santa · $30 limit · Swap Sat 19 Dec</p>
</div>
<div style="background: #0E3A2D; color: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Names are drawn</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #C4DACF">Amara shook the hat at 6:02 pm. Yours is wrapped and waiting.</p>
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="display: flex; gap: 6px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="8">
<span style="{{d.style}}"></span>
</sc-for>
</div>
<span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">3 of 8 unwrapped</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{members}}" as="m" hint-placeholder-count="8">
<div style="background: #FFFFFF; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; border: 1.5px solid #DCE6E1">
<span aria-hidden="true" style="{{m.avatar}}">{{m.initial}}</span>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 700">{{m.name}}</span>
<span style="font-size: 12px; color: #40564D">{{m.status}}</span>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed #9DB5AA">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10231C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
<span style="font-size: 13px; line-height: 1.4; color: #10231C">House rule: Leo and Sofia can't draw each other.</span>
</div>
<div style="flex-grow: 1"></div>
<a class="press" href="Draw.dc.html" style="height: 58px; border-radius: 18px; background: #D62F3A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 19px">Unwrap my match</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const people = [
['Amara', 'Organiser · unwrapped', '#D62F3A', '#FFFFFF'],
['Tunde', 'You · still wrapped', '#F4B83A', '#10231C'],
['Priya', 'Unwrapped', '#0E3A2D', '#FFFFFF'],
['Leo', 'Unwrapped', '#10231C', '#FFFFFF'],
['Sofia', 'Still wrapped', '#D62F3A', '#FFFFFF'],
['Kenji', 'Still wrapped', '#F4B83A', '#10231C'],
['Zainab', 'Still wrapped', '#0E3A2D', '#FFFFFF'],
['Marco', 'Still wrapped', '#10231C', '#FFFFFF']
];
const members = people.map((p) => ({
name: p[0],
status: p[1],
initial: p[0][0],
avatar: 'width:36px;height:36px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Bricolage Grotesque,system-ui,sans-serif;font-weight:800;font-size:16px;background:' + p[2] + ';color:' + p[3]
}));
const dots = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({
style: 'width:12px;height:12px;border-radius:50%;background:' + (i < 3 ? '#F4B83A' : '#2F5F4E')
}));
return { members: members, dots: dots };
}
}
</script>
</body>
</html>
