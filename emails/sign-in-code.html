<!-- The sign-in code email, sent by lib/email/send-sign-in-code.ts.
     {{code}} and {{expires_in}} are filled per email; images load from the live site. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Your Hatful code: {{code}}</title>
</head>
<body style="margin:0;padding:0;background-color:#0E3A2D;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#0E3A2D;">Your code is {{code}}. It expires in {{expires_in}}.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0E3A2D" style="background-color:#0E3A2D;">
  <!-- Candy stripe from the app; clients without gradients show solid berry. -->
  <tr>
    <td height="12" bgcolor="#D62F3A" style="height:12px;font-size:0;line-height:0;background-color:#D62F3A;background-image:repeating-linear-gradient(135deg,#D62F3A 0 14px,#FFFFFF 14px 28px);">&nbsp;</td>
  </tr>
  <tr>
    <td align="center" style="padding:0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
        <tr>
          <td style="padding:24px 24px 0 24px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="34" style="width:34px;padding-right:10px;vertical-align:middle;">
                  <img src="https://hatful-handover.vercel.app/email/hat.png" width="34" height="34" alt="" style="display:block;width:34px;height:34px;border:0;">
                </td>
                <td style="vertical-align:middle;font-family:'Bricolage Grotesque','Arial Black',Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;line-height:28px;letter-spacing:-0.2px;color:#FFFFFF;">
                  Hatful
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:30px 24px 0 44px;line-height:0;font-size:0;">
            <img src="https://hatful-handover.vercel.app/email/tag-string.png" width="120" height="60" alt="" style="display:block;width:120px;height:60px;border:0;margin-bottom:-22px;">
          </td>
        </tr>
        <tr>
          <td style="padding:0 24px;">
            <!-- The gift tag from Join: tilted where clients allow transforms, straight elsewhere. -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="background-color:#FFFFFF;border-radius:22px;transform:rotate(-3deg);box-shadow:0 18px 0 #0A2B21;">
              <tr>
                <td style="padding:26px 24px 24px 24px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td width="20" height="20" bgcolor="#0E3A2D" style="width:20px;height:20px;border-radius:10px;background-color:#0E3A2D;font-size:0;line-height:0;">&nbsp;</td>
                      <td style="padding-left:12px;font-family:'DM Sans',Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#C22630;">
                        Your sign-in code
                      </td>
                    </tr>
                  </table>
                  <h1 style="margin:14px 0 0 0;font-family:'Bricolage Grotesque','Arial Black',Arial,Helvetica,sans-serif;font-size:30px;font-weight:800;line-height:32px;letter-spacing:-0.5px;color:#10231C;">
                    Here&rsquo;s your code to get into the hat
                  </h1>
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:20px;">
                    <tr>
                      <td align="center" bgcolor="#0E3A2D" style="background-color:#0E3A2D;border-radius:14px;padding:20px 12px;font-family:'DM Sans',Arial,Helvetica,sans-serif;font-size:40px;font-weight:700;line-height:44px;letter-spacing:10px;color:#FFFFFF;">
                        {{code}}
                      </td>
                    </tr>
                  </table>
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:16px;">
                    <tr>
                      <td bgcolor="#F4B83A" style="background-color:#F4B83A;border-radius:999px;padding:7px 12px;font-family:'DM Sans',Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;line-height:16px;color:#10231C;">
                        It expires in {{expires_in}}
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:44px 24px 36px 24px;font-family:'DM Sans',Arial,Helvetica,sans-serif;font-size:13px;line-height:19px;color:#C4DACF;">
            Didn&rsquo;t ask for this? You can ignore it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
